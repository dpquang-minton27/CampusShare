name: CampusShare develop - Android mock CI
on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  mock-build-and-unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK Platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests + assemble + lint in MOCK mode
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - name: Save debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: campusshare-bc3-mock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
